[package]
name = "monobit"
version = "1.0.0"
description = "Monobit - a 1-bit pixel art studio"
edition = "2021"

[lib]
name = "monobit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
base64 = "0.22"
arboard = { version = "3", default-features = false, features = ["image-data"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
